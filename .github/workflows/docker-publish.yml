name: Docker

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Push this architecture by digest only. The merge job combines both
      # digests into the tagged multi-arch manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          build-args: |
            GIT_HASH=${{ github.sha }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::Build produced no digest"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digest"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digest/digest"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digest/digest
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: Build (arm64)
    # GitHub-hosted native arm64 runner. This repository is public, so the
    # runner is available at no cost.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Push this architecture by digest only. The merge job combines both
      # digests into the tagged multi-arch manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          build-args: |
            GIT_HASH=${{ github.sha }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::Build produced no digest"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digest"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digest/digest"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digest/digest
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests
    needs: [build, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Each build artifact contains a single one-line `digest` file. Keeping
      # the artifacts in separate directories makes it unambiguous which
      # digest belongs to which architecture.
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          AMD64_DIGEST_FILE: ${{ runner.temp }}/digests/digest-amd64/digest
          ARM64_DIGEST_FILE: ${{ runner.temp }}/digests/digest-arm64/digest
        run: |
          set -euo pipefail

          for file in "${AMD64_DIGEST_FILE}" "${ARM64_DIGEST_FILE}"; do
            if [ ! -s "${file}" ]; then
              echo "::error::Missing digest file: ${file}"
              exit 1
            fi
          done

          amd64="$(tr -d '[:space:]' < "${AMD64_DIGEST_FILE}")"
          arm64="$(tr -d '[:space:]' < "${ARM64_DIGEST_FILE}")"
          for digest in "${amd64}" "${arm64}"; do
            case "${digest}" in
              sha256:*) ;;
              *)
                echo "::error::Unexpected digest format: ${digest}"
                exit 1
                ;;
            esac
          done

          args=()
          while IFS= read -r tag; do
            args+=(-t "${tag}")
          done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          args+=("ghcr.io/${{ github.repository }}@${amd64}")
          args+=("ghcr.io/${{ github.repository }}@${arm64}")

          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"

      # Configure one or more webhook URLs via the PORTAINER_WEBHOOK_URLS
      # repository variable, separated by newlines or commas. The legacy
      # PORTAINER_WEBHOOK_URL variable is still supported. This runs after the
      # manifest is written so Portainer never pulls a half-published tag.
      - name: Trigger Portainer webhooks
        if: success() && github.ref == 'refs/heads/main'
        env:
          PORTAINER_WEBHOOK_URL: ${{ vars.PORTAINER_WEBHOOK_URL }}
          PORTAINER_WEBHOOK_URLS: ${{ vars.PORTAINER_WEBHOOK_URLS }}
        run: |
          set -euo pipefail

          urls=()
          while IFS= read -r url; do
            url="$(printf '%s' "$url" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$url" ]; then
              urls+=("$url")
            fi
          done < <(printf '%s\n' "${PORTAINER_WEBHOOK_URLS:-}" | tr -d '\r' | tr ',' '\n')

          if [ -n "${PORTAINER_WEBHOOK_URL:-}" ]; then
            urls+=("$PORTAINER_WEBHOOK_URL")
          fi

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No Portainer webhook URLs configured; skipping."
            exit 0
          fi

          # Keep webhook tokens out of the log while still identifying which
          # endpoint failed: mask long path segments (Portainer webhook keys)
          # and query-string values.
          display_url() {
            printf '%s' "$1" | sed -E \
              -e 's#(https?://[^/]+(/[^/?#]+)*/)[^/?#]{8,}([?#]|$)#\1***\3#' \
              -e 's#([?&][^=]+=)[^&]*#\1***#g'
          }

          # A dead Portainer must never hold the job open. Bound each attempt
          # (10s to connect, 30s total) and cap the retry window at 60s; the
          # outer timeout is the authoritative per-URL budget (60s of retries
          # plus one final 30s attempt, with a little slack).
          connect_timeout=10
          max_time=30
          retries=3
          retry_max_time=60
          per_url_budget=95

          failed=0
          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            shown="$(display_url "$url")"
            echo "::add-mask::${url}"
            echo "Triggering Portainer webhook #$((i + 1)) of ${#urls[@]}: ${shown}"

            SECONDS=0
            rc=0
            timeout --kill-after=5 "${per_url_budget}" \
              curl -fsSL --retry "${retries}" --retry-delay 2 \
                --retry-max-time "${retry_max_time}" \
                --connect-timeout "${connect_timeout}" --max-time "${max_time}" \
                -X POST \
                -H "Accept: application/json" \
                "${url}" || rc=$?
            elapsed=$SECONDS

            if [ "$rc" -eq 0 ]; then
              echo "Portainer webhook #$((i + 1)) succeeded after ${elapsed}s"
            elif [ "$rc" -eq 124 ] || [ "$rc" -eq 28 ]; then
              echo "::warning::Portainer webhook #$((i + 1)) (${shown}) timed out after ${elapsed}s (connect ${connect_timeout}s, max ${max_time}s per attempt, ${retries} retries, ${per_url_budget}s per-URL cap)"
              failed=$((failed + 1))
            else
              echo "::warning::Portainer webhook #$((i + 1)) (${shown}) failed after ${elapsed}s with exit code ${rc} (connect ${connect_timeout}s, max ${max_time}s per attempt, ${retries} retries)"
              failed=$((failed + 1))
            fi
          done

          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed of ${#urls[@]} Portainer webhook(s) failed; continuing."
          fi

  deploy:
    name: Redeploy Portainer stack
    runs-on: ubuntu-latest
    needs: merge
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Redeploy stack via Portainer API
        shell: bash
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: |
          set -euo pipefail

          PORTAINER_URL="${PORTAINER_URL%/}"

          # --- Find the stack by name (never hardcode Id/EndpointId) ---
          stacks_response=$(curl -sS -w "\n%{http_code}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks")
          stacks_status=$(printf '%s\n' "$stacks_response" | tail -n 1)
          stacks_body=$(printf '%s\n' "$stacks_response" | sed '$d')

          if [ "$stacks_status" -lt 200 ] || [ "$stacks_status" -ge 300 ]; then
            echo "Portainer GET /api/stacks failed with HTTP status ${stacks_status}"
            printf '%s\n' "$stacks_body"
            exit 1
          fi

          stack_id=$(printf '%s\n' "$stacks_body" | jq -r '[.[] | select(.Name == "paseo")][0].Id // empty')
          endpoint_id=$(printf '%s\n' "$stacks_body" | jq -r '[.[] | select(.Name == "paseo")][0].EndpointId // empty')
          env_array=$(printf '%s\n' "$stacks_body" | jq '[.[] | select(.Name == "paseo")][0].Env // []')

          if [ -z "$stack_id" ] || [ "$stack_id" = "null" ]; then
            echo "Portainer stack named 'paseo' not found in /api/stacks"
            printf '%s\n' "$stacks_body"
            exit 1
          fi
          if [ -z "$endpoint_id" ] || [ "$endpoint_id" = "null" ]; then
            echo "Portainer stack 'paseo' has no EndpointId"
            printf '%s\n' "$stacks_body"
            exit 1
          fi

          echo "Found stack 'paseo': Id=${stack_id}, EndpointId=${endpoint_id}"

          # --- Capture the currently running image id of paseo-big ---
          get_paseo_big_image() {
            local resp status body
            resp=$(curl -sS -w "\n%{http_code}" \
              -H "X-API-Key: ${PORTAINER_API_KEY}" \
              "${PORTAINER_URL}/api/endpoints/${endpoint_id}/docker/containers/json")
            status=$(printf '%s\n' "$resp" | tail -n 1)
            body=$(printf '%s\n' "$resp" | sed '$d')
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
              echo "Portainer GET /api/endpoints/${endpoint_id}/docker/containers/json failed with HTTP status ${status}" >&2
              printf '%s\n' "$body" >&2
              return 1
            fi
            printf '%s\n' "$body" | jq -r '[.[] | select((.Names // []) | any(. == "/paseo-big"))][0].ImageID // empty'
          }

          old_image=$(get_paseo_big_image)
          if [ -z "$old_image" ]; then
            echo "Could not find a running paseo-big container before redeploy"
            exit 1
          fi
          echo "paseo-big currently running image: ${old_image}"

          # --- Read the stack's current file (preserve what is running) ---
          file_response=$(curl -sS -w "\n%{http_code}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            "${PORTAINER_URL}/api/stacks/${stack_id}/file")
          file_status=$(printf '%s\n' "$file_response" | tail -n 1)
          file_body=$(printf '%s\n' "$file_response" | sed '$d')

          if [ "$file_status" -lt 200 ] || [ "$file_status" -ge 300 ]; then
            echo "Portainer GET /api/stacks/${stack_id}/file failed with HTTP status ${file_status}"
            printf '%s\n' "$file_body"
            exit 1
          fi

          stack_file_content=$(printf '%s\n' "$file_body" | jq -r '.StackFileContent // empty')
          if [ -z "$stack_file_content" ]; then
            echo "Portainer /api/stacks/${stack_id}/file returned no StackFileContent"
            printf '%s\n' "$file_body"
            exit 1
          fi

          # --- PUT the unchanged file back with existing Env and PullImage ---
          body=$(jq -n \
            --arg compose "$stack_file_content" \
            --argjson env "$env_array" \
            '{StackFileContent: $compose, Env: $env, PullImage: true}')

          put_response=$(curl -sS -w "\n%{http_code}" \
            -X PUT "${PORTAINER_URL}/api/stacks/${stack_id}?endpointId=${endpoint_id}" \
            -H "X-API-Key: ${PORTAINER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$body")
          put_status=$(printf '%s\n' "$put_response" | tail -n 1)
          put_body=$(printf '%s\n' "$put_response" | sed '$d')

          if [ "$put_status" -lt 200 ] || [ "$put_status" -ge 300 ]; then
            echo "Portainer PUT /api/stacks/${stack_id} failed with HTTP status ${put_status}"
            printf '%s\n' "$put_body"
            exit 1
          fi

          echo "Portainer stack redeployed (PUT accepted)"

          # --- Poll for paseo-big to come back with a new image id ---
          timeout_seconds=180
          deadline=$((SECONDS + timeout_seconds))
          new_image=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            new_image=$(get_paseo_big_image) || true
            if [ -n "$new_image" ] && [ "$new_image" != "$old_image" ]; then
              echo "paseo-big now running image: ${new_image}"
              exit 0
            fi
            sleep 5
          done

          if [ "$new_image" = "$old_image" ]; then
            echo "Portainer accepted the PUT but paseo-big still runs the old image (${old_image}); the container was not recreated."
          else
            echo "Timed out after ${timeout_seconds}s waiting for paseo-big to come back (last image: ${new_image:-<none>})"
          fi
          exit 1
