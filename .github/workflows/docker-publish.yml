name: Docker

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

jobs:
  build-amd64:
    name: Build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Push this architecture by digest only. The merge job combines both
      # digests into the tagged multi-arch manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-amd64
          cache-to: type=gha,mode=max,scope=build-amd64
          build-args: |
            GIT_HASH=${{ github.sha }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::Build produced no digest"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: Build (arm64)
    # Native arm64 build on the VPS. This requires a self-hosted runner with
    # all three labels; see RUNNER.md. If no runner is registered the job
    # stays queued indefinitely (timeout-minutes does not count queue time)
    # and the merge job never runs.
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Push this architecture by digest only. The merge job combines both
      # digests into the tagged multi-arch manifest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-arm64
          cache-to: type=gha,mode=max,scope=build-arm64
          build-args: |
            GIT_HASH=${{ github.sha }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::Build produced no digest"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/digests"
          shopt -s nullglob
          digests=(*)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "::error::Expected 2 digests (amd64, arm64), found ${#digests[@]}"
            exit 1
          fi

          mapfile -t tags < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "${tag}")
          done
          for digest in "${digests[@]}"; do
            args+=("ghcr.io/${{ github.repository }}@sha256:${digest}")
          done

          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"

      # Configure one or more webhook URLs via the PORTAINER_WEBHOOK_URLS
      # repository variable, separated by newlines or commas. The legacy
      # PORTAINER_WEBHOOK_URL variable is still supported. This runs after the
      # manifest is written so Portainer never pulls a half-published tag.
      - name: Trigger Portainer webhooks
        if: github.ref == 'refs/heads/main'
        env:
          PORTAINER_WEBHOOK_URL: ${{ vars.PORTAINER_WEBHOOK_URL }}
          PORTAINER_WEBHOOK_URLS: ${{ vars.PORTAINER_WEBHOOK_URLS }}
        run: |
          set -euo pipefail

          urls=()
          while IFS= read -r url; do
            url="$(printf '%s' "$url" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$url" ]; then
              urls+=("$url")
            fi
          done < <(printf '%s\n' "${PORTAINER_WEBHOOK_URLS:-}" | tr -d '\r' | tr ',' '\n')

          if [ -n "${PORTAINER_WEBHOOK_URL:-}" ]; then
            urls+=("$PORTAINER_WEBHOOK_URL")
          fi

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No Portainer webhook URLs configured; skipping."
            exit 0
          fi

          # Keep webhook tokens out of the log while still identifying which
          # endpoint failed: mask long path segments (Portainer webhook keys)
          # and query-string values.
          display_url() {
            printf '%s' "$1" | sed -E \
              -e 's#(https?://[^/]+(/[^/?#]+)*/)[^/?#]{8,}([?#]|$)#\1***\3#' \
              -e 's#([?&][^=]+=)[^&]*#\1***#g'
          }

          # A dead Portainer must never hold the job open. Bound each attempt
          # (10s to connect, 30s total) and cap the retry window at 60s; the
          # outer timeout is the authoritative per-URL budget (60s of retries
          # plus one final 30s attempt, with a little slack).
          connect_timeout=10
          max_time=30
          retries=3
          retry_max_time=60
          per_url_budget=95

          failed=0
          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            shown="$(display_url "$url")"
            echo "::add-mask::${url}"
            echo "Triggering Portainer webhook #$((i + 1)) of ${#urls[@]}: ${shown}"

            SECONDS=0
            rc=0
            timeout --kill-after=5 "${per_url_budget}" \
              curl -fsSL --retry "${retries}" --retry-delay 2 \
                --retry-max-time "${retry_max_time}" \
                --connect-timeout "${connect_timeout}" --max-time "${max_time}" \
                -X POST \
                -H "Accept: application/json" \
                "${url}" || rc=$?
            elapsed=$SECONDS

            if [ "$rc" -eq 0 ]; then
              echo "Portainer webhook #$((i + 1)) succeeded after ${elapsed}s"
            elif [ "$rc" -eq 124 ] || [ "$rc" -eq 28 ]; then
              echo "::warning::Portainer webhook #$((i + 1)) (${shown}) timed out after ${elapsed}s (connect ${connect_timeout}s, max ${max_time}s per attempt, ${retries} retries, ${per_url_budget}s per-URL cap)"
              failed=$((failed + 1))
            else
              echo "::warning::Portainer webhook #$((i + 1)) (${shown}) failed after ${elapsed}s with exit code ${rc} (connect ${connect_timeout}s, max ${max_time}s per attempt, ${retries} retries)"
              failed=$((failed + 1))
            fi
          done

          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed of ${#urls[@]} Portainer webhook(s) failed; continuing."
          fi
