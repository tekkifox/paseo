name: Docker

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_HASH=${{ github.sha }}

      # Configure one or more webhook URLs via the PORTAINER_WEBHOOK_URLS
      # repository variable, separated by newlines or commas. The legacy
      # PORTAINER_WEBHOOK_URL variable is still supported.
      - name: Trigger Portainer webhooks
        if: github.ref == 'refs/heads/main'
        env:
          PORTAINER_WEBHOOK_URL: ${{ vars.PORTAINER_WEBHOOK_URL }}
          PORTAINER_WEBHOOK_URLS: ${{ vars.PORTAINER_WEBHOOK_URLS }}
        run: |
          set -euo pipefail

          urls=()
          while IFS= read -r url; do
            url="$(printf '%s' "$url" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [ -n "$url" ]; then
              urls+=("$url")
            fi
          done < <(printf '%s\n' "${PORTAINER_WEBHOOK_URLS:-}" | tr -d '\r' | tr ',' '\n')

          if [ -n "${PORTAINER_WEBHOOK_URL:-}" ]; then
            urls+=("$PORTAINER_WEBHOOK_URL")
          fi

          if [ "${#urls[@]}" -eq 0 ]; then
            echo "No Portainer webhook URLs configured; skipping."
            exit 0
          fi

          failed=0
          for i in "${!urls[@]}"; do
            echo "Triggering Portainer webhook #$((i + 1)) of ${#urls[@]}"
            if ! curl -fsSL --retry 3 \
              -X POST \
              -H "Accept: application/json" \
              "${urls[$i]}"; then
              echo "::warning::Portainer webhook #$((i + 1)) failed"
              failed=$((failed + 1))
            fi
          done

          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed of ${#urls[@]} Portainer webhook(s) failed; continuing."
          fi
