name: Docker

on:
  push:
    branches: ["main"]
  # Pull requests build both architectures as a check, but never push: a pull
  # request image has no tag and leaves nothing behind in the registry.
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
      - "paseo-cron"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Push this architecture by digest only. The merge job combines both
      # digests into the tagged multi-arch manifest. A pull request build has
      # no tag and stays local to the runner.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
          build-args: |
            GIT_HASH=${{ github.sha }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::Build produced no digest"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digest"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digest/digest"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-amd64
          path: ${{ runner.temp }}/digest/digest
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    name: Build (arm64)
    # GitHub-hosted native arm64 runner. This repository is public, so the
    # runner is available at no cost.
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      # Push this architecture by digest only. The merge job combines both
      # digests into the tagged multi-arch manifest. A pull request build has
      # no tag and stays local to the runner.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || format('type=image,name=ghcr.io/{0},push-by-digest=true,name-canonical=true,push=true', github.repository) }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,mode=max,scope=arm64
          build-args: |
            GIT_HASH=${{ github.sha }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "::error::Build produced no digest"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digest"
          printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digest/digest"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: digest-arm64
          path: ${{ runner.temp }}/digest/digest
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests
    needs: [build, build-arm64]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Each build artifact contains a single one-line `digest` file. Keeping
      # the artifacts in separate directories makes it unambiguous which
      # digest belongs to which architecture.
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Create manifest list and push
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
          AMD64_DIGEST_FILE: ${{ runner.temp }}/digests/digest-amd64/digest
          ARM64_DIGEST_FILE: ${{ runner.temp }}/digests/digest-arm64/digest
        run: |
          set -euo pipefail

          for file in "${AMD64_DIGEST_FILE}" "${ARM64_DIGEST_FILE}"; do
            if [ ! -s "${file}" ]; then
              echo "::error::Missing digest file: ${file}"
              exit 1
            fi
          done

          amd64="$(tr -d '[:space:]' < "${AMD64_DIGEST_FILE}")"
          arm64="$(tr -d '[:space:]' < "${ARM64_DIGEST_FILE}")"
          for digest in "${amd64}" "${arm64}"; do
            case "${digest}" in
              sha256:*) ;;
              *)
                echo "::error::Unexpected digest format: ${digest}"
                exit 1
                ;;
            esac
          done

          args=()
          while IFS= read -r tag; do
            args+=(-t "${tag}")
          done < <(jq -r '.tags[]' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          args+=("ghcr.io/${{ github.repository }}@${amd64}")
          args+=("ghcr.io/${{ github.repository }}@${arm64}")

          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"

  # The fleet's stacks live as files in tekkifox/infrastructure-as-code and are
  # applied by Ansible. Its deploy-stack.yml workflow does exactly what this job
  # does, but that repository is private and this one is public, and GitHub
  # does not let a public caller use a reusable workflow from a private
  # repository. So the tailnet join and SSH call are inlined here; the deploy
  # seat on mgmt remains the authority and validates the host and stack names.
  # The seat's tailnet address is a secret (DEPLOY_SEAT_HOST), so no real
  # hostname is published in this repository.
  deploy:
    name: Deploy paseo
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The seat is only reachable over the tailnet, so join it before the SSH
      # call.
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-paseo-${{ github.run_id }}

      - name: Ask the fleet deploy seat to deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SEAT_HOST: ${{ secrets.DEPLOY_SEAT_HOST }}
          TARGET_HOST: paseo
          TARGET_STACKS: paseo-app
        run: |
          set -euo pipefail

          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 0600 "$HOME/.ssh/deploy"

          ssh -i "$HOME/.ssh/deploy" -p 32 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@"$DEPLOY_SEAT_HOST" \
            "fleet-deploy $TARGET_HOST $TARGET_STACKS deploy"
