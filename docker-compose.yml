services:
  paseo:
    build: .
    image: ghcr.io/getpaseo/paseo:latest
    # Compose (standalone) limits
    cpus: 1.0
    mem_limit: 1g
    memswap_limit: 1g
    # Swarm / Portainer stack limits (ignored by plain `docker compose up`)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
